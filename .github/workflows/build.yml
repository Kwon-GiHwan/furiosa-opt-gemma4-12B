name: cycle-diagnostics

# Stage 1 채점 서버와 같은 순서로 "빌드 가능성"을 확인한다.
#   1. 툴체인 설치 (scripts/install_toolchain.sh, README Toolchain 절차)
#   2. 세 커널 컴파일 + 스케줄 덤프 (artifact 로 보관)
#   3. tests/test_kernels 바이너리 빌드 (RNGD 에 제출되는 실행 파일)
#   4. (secret 이 있을 때만) fixture 생성 후 scripts/rngd_test.sh 로 Arena 에 제출해
#      정확도와 실제 RNGD cycles 를 받는다. secret: FURIOSA_ARENA_TOKEN, variable: FURIOSA_ARENA_URL

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Diagnostic experiment
        type: choice
        default: cross
        options: [cross, transfer, unprofiled, cost]

concurrency:
  group: cycle-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    # 툴체인이 x86_64 Linux + GLIBC 2.34 이상만 지원한다.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON((inputs.probe == 'transfer' || inputs.probe == 'unprofiled') && '["sliding_attention_output"]' || '["sliding_project_qkv", "sliding_attention_output", "decoder_feedforward"]') }}
        mode: ["${{ inputs.probe }}"]

    env:
      FURIOSA_ARENA_TOKEN: ${{ secrets.FURIOSA_ARENA_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.rustup/toolchains
          key: toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'scripts/install_toolchain.sh') }}

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-

      - name: Install toolchain
        run: bash scripts/install_toolchain.sh

      - name: Compile Stage 1 kernels and dump schedules
        run: |
          mkdir -p target/schedules
          for k in sliding_project_qkv sliding_attention_output decoder_feedforward; do
            echo "::group::ops::$k"
            cargo furiosa-opt compile "ops::$k" --exact \
              --dump-schedule "target/schedules/$k.json"
            echo "::endgroup::"
          done

      - name: Report schedule makespans
        run: |
          {
            echo "## Schedule makespan (compiler estimate, not RNGD cycles)"
            echo
            echo "| kernel | makespan |"
            echo "|---|---:|"
            for f in target/schedules/*.json; do
              k=$(basename "$f" .json)
              m=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(max(i['lifetime']['end'] for i in d['instructions']))" "$f")
              echo "| $k | $m |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The 0.6 compile subcommand has no --features option. Enable the
      # diagnostic feature in a temporary manifest only for device compilation.
      - name: Compile diagnostic warmup kernel
        run: |
          cp Cargo.toml target/Cargo.toml.before-diagnostic
          trap 'cp target/Cargo.toml.before-diagnostic Cargo.toml' EXIT
          python3 -c 'from pathlib import Path; p=Path("Cargo.toml"); s=p.read_text(); assert "[features]\n" in s; p.write_text(s.replace("[features]\n", "[features]\ndefault = [\"cycle-diagnostics\"]\n", 1))'
          cargo furiosa-opt compile diagnostics::warmup_copy --dump-schedule target/schedules/warmup_copy.json

      - name: Build test_kernels binary
        run: |
          mkdir -p target
          cargo furiosa-opt test --release --features cycle-diagnostics --test cycle_diagnostics --no-run --message-format=json | tee target/diagnostic-build.jsonl

      # ---- RNGD 실행 (Arena 토큰이 등록된 저장소에서만) ----
      - name: Set up Python for fixture generation
        if: env.FURIOSA_ARENA_TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/build.yml

      - name: Generate kernel fixture
        if: env.FURIOSA_ARENA_TOKEN != ''
        run: |
          pip install --quiet numpy safetensors torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python3 scripts/generate_references.py
          ls -la ref/

      - name: Select diagnostic executable
        run: |
          binary=$(python3 -c 'import json,sys; rows=[json.loads(line) for line in open(sys.argv[1]) if line.startswith("{")]; paths={r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="cycle_diagnostics" and r.get("executable")}; assert len(paths)==1, paths; print(paths.pop())' target/diagnostic-build.jsonl)
          test -n "$binary"
          cp "$binary" target/release/deps/test_kernels-diagnostic
          chmod +x target/release/deps/test_kernels-diagnostic
          touch target/release/deps/test_kernels-diagnostic

      - name: Configure remote diagnostic conditions
        env:
          DIAG_KERNEL: ${{ matrix.kernel }}
          DIAG_MODE: ${{ matrix.mode }}
        run: |
          {
            printf '#!/bin/sh\nexport DIAG_KERNEL="%s"\nexport DIAG_MODE="%s"\n' "$DIAG_KERNEL" "$DIAG_MODE"
            printf '%s\n' 'export FURIOSA_VISIBLE_DEVICES="${FURIOSA_VISIBLE_DEVICES:-0}"' 'hostname' 'echo "visible_devices=$FURIOSA_VISIBLE_DEVICES"' 'if command -v furiosa-smi >/dev/null 2>&1; then furiosa-smi info --format full; fi'
            cat scripts/rngd/remote_entrypoint.sh
          } > target/diagnostic_entrypoint.sh
          cp target/diagnostic_entrypoint.sh scripts/rngd/remote_entrypoint.sh

      - name: Run kernel tests on RNGD (accuracy + cycles)
        if: env.FURIOSA_ARENA_TOKEN != ''
        env:
          FURIOSA_ARENA_URL: ${{ vars.FURIOSA_ARENA_URL }}
          RNGD_JOB_NAME: COSLAB-${{ matrix.kernel }}-${{ matrix.mode }}
        run: |
          rm -f target/rngd/last_job_id
          ./scripts/rngd_test.sh --no-build 2>&1 | tee target/rngd_test.log
          grep -q '^DIAG_COMPLETE ' target/rngd_test.log

      # 제출한 작업의 status / log / result 를 내려받아 artifact 와 Summary 에 남긴다.
      # 실패해도 실행되며(!cancelled), summary.json 은 이후 Slack 연동의 입력이 된다.
      - name: Fetch RNGD job log and result
        id: rngd
        if: env.FURIOSA_ARENA_TOKEN != '' && !cancelled()
        env:
          FURIOSA_ARENA_URL: ${{ vars.FURIOSA_ARENA_URL }}
        run: |
          test -f target/rngd/last_job_id || exit 0
          ./scripts/rngd_fetch.sh | tee -a "$GITHUB_STEP_SUMMARY"
          job=$(cat target/rngd/last_job_id)
          echo "job-id=$job" >> "$GITHUB_OUTPUT"
          echo "summary=$(tr -d '\n' < "target/rngd/$job/summary.json")" >> "$GITHUB_OUTPUT"

      - name: Upload schedules and test binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ matrix.kernel }}-${{ matrix.mode }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/schedules/*.json
            target/release/deps/test_kernels-*
            !target/release/deps/*.d
            target/rngd_test.log
            target/rngd/**
